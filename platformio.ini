; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esp-builtin
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
	adafruit/Adafruit_VL53L0X@^1.2.5

build_type = debug
debug_tool = esp-builtin
debug_server = 
	${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
	-f
	${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts/board/esp32c3-builtin.cfg
board_build.partitions = huge_app.csv